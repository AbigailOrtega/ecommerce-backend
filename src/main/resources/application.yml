# =============================================================================
# Common Configuration (all profiles)
# =============================================================================
server:
  port: 8080

spring:
  application:
    name: ecommerce
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  # Mail configuration
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  # Jackson 3 rejects null for a primitive (e.g. a boolean flag sent as null); Jackson 2 read it as
  # false and clients may rely on that
  jackson:
    deserialization:
      fail-on-null-for-primitives: false

  # Migrations are PostgreSQL SQL: only the prod profile runs them; H2 profiles let Hibernate build the schema
  flyway:
    enabled: false

  jpa:
    properties:
      hibernate:
        # loads lazy collections (product colors → sizes, order items…) in batches instead of one query each
        default_batch_fetch_size: 50
        # one database for every store: rows carry tenant_id and Hibernate filters by the current store
        tenant_identifier_resolver: com.ecommerce.tenant.TenantIdentifierResolver

# JWT Configuration
app:
  # one backend for every store (see com.ecommerce.tenant): hosts no store claims are served as this
  # one locally (localhost); production sets none, so a domain no store claims gets "Tienda no encontrada"
  tenancy:
    default-tenant-id: ${DEFAULT_TENANT_ID:1}
  # encrypts each store's Stripe/PayPal/Skydropx secrets in the database (openssl rand -base64 32)
  encryption-key: ${ENCRYPTION_KEY:}
  # the platform's API (/api/platform), for its super admins (table platform_admins, added by hand)
  platform:
    # the only domain that serves it (a store's domain gets a 404); unset = the platform is off
    host: ${PLATFORM_HOST:}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    per-ip-enabled: ${RATE_LIMIT_PER_IP_ENABLED:true}
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration: 1800000     # 30 minutes in milliseconds (renewed silently with the refresh token)
    refresh-token-expiration: 7776000000 # 90 days in milliseconds
    # the refresh token cookie is Secure (https only); local http profiles turn it off
    refresh-cookie-secure: ${REFRESH_COOKIE_SECURE:true}
  # The first admin. At startup, while the store has no admin, this account is made admin (or
  # created, and sent a link to set its password). Ignored once an admin exists.
  admin:
    bootstrap-email: ${ADMIN_EMAIL:}
  # Mexico's postal code catalog, downloaded from Correos de México when the table is empty and
  # on the 1st of each month (PostalCodeCatalogService). Off in tests: no network there.
  postal-codes:
    auto-download: ${POSTAL_CODES_AUTO_DOWNLOAD:true}

  # Stripe Configuration
  stripe:
    secret-key: ${STRIPE_SECRET_KEY}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET}
    public-key: ${STRIPE_PUBLIC_KEY}

  # PayPal Configuration
  paypal:
    client-id: ${PAYPAL_CLIENT_ID}
    client-secret: ${PAYPAL_CLIENT_SECRET}
    mode: ${PAYPAL_MODE:sandbox}
    webhook-id: ${PAYPAL_WEBHOOK_ID:}

  # Email Configuration
  mail:
    from: ${MAIL_FROM:${MAIL_USERNAME:}}
    frontend-url: ${FRONTEND_URL:http://localhost:4200}
    # when set, mail goes through Resend's HTTPS API instead of SMTP (Render's free plan blocks SMTP)
    resend-api-key: ${RESEND_API_KEY:}

  # Skydropx Configuration
  skydropx:
    client-id: ${SKYDROPX_CLIENT_ID}
    client-secret: ${SKYDROPX_CLIENT_SECRET}
    sandbox: ${SKYDROPX_SANDBOX:true}
    webhook-secret: ${SKYDROPX_WEBHOOK_SECRET:}

  # Cloudinary Configuration
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME}
    api-key: ${CLOUDINARY_API_KEY}
    api-secret: ${CLOUDINARY_API_SECRET}
    image:
      product-max-width: ${CLOUDINARY_PRODUCT_MAX_WIDTH:1200}
      product-max-height: ${CLOUDINARY_PRODUCT_MAX_HEIGHT:1200}
      banner-max-width: ${CLOUDINARY_BANNER_MAX_WIDTH:1920}
      banner-max-height: ${CLOUDINARY_BANNER_MAX_HEIGHT:600}

# Only the health check is exposed (Render / Docker probe /actuator/health); no details to anonymous callers
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  health:
    # mail is optional (Resend over HTTPS in production); a slow SMTP server must not mark the app down
    mail:
      enabled: false

# Error reporting. Without SENTRY_DSN nothing is sent. Every log.error becomes a Sentry event, which
# includes the 500s answered by GlobalExceptionHandler (Sentry never sees those as unhandled).
sentry:
  dsn: ${SENTRY_DSN:}
  environment: ${SENTRY_ENVIRONMENT:production}
  send-default-pii: false
  traces-sample-rate: 0.0
  logging:
    minimum-event-level: error
    minimum-breadcrumb-level: info

# SpringDoc / Swagger
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

---
# =============================================================================
# Development Profile
# =============================================================================
spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:h2:mem:ecommerce_dev;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

app:
  jwt:
    # plain http on localhost
    refresh-cookie-secure: false

logging:
  level:
    com.ecommerce: DEBUG
    org.springframework.security: DEBUG

---
# =============================================================================
# E2E Test Profile  (mvn spring-boot:run -Dspring-boot.run.profiles=e2e)
# Uses H2 in-memory, seeds test users automatically, emails fail silently.
# =============================================================================
spring:
  config:
    activate:
      on-profile: e2e

  datasource:
    # one database per Spring context: with create-drop, a test context closing (@DirtiesContext)
    # used to drop the tables under every other cached context sharing the same in-memory name
    url: jdbc:h2:mem:ecommerce_e2e_${random.uuid};DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: false

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false

  # Point mail to a non-existent host so send attempts fail silently (@Async)
  mail:
    host: localhost
    port: 25

app:
  postal-codes:
    auto-download: false   # no network in e2e runs; TestDataInitializer seeds a few codes
  payments:
    fees:
      # the accounting tests read commissions a few seconds after paying
      initial-delay: PT2S
      interval: PT3S
  jwt:
    # plain http on localhost
    refresh-cookie-secure: false

logging:
  level:
    com.ecommerce: INFO
    org.springframework.security: WARN

---
# =============================================================================
# Production Profile
# =============================================================================
spring:
  config:
    activate:
      on-profile: prod

  flyway:
    enabled: true
    # a database that predates Flyway is recorded as version 1 (its existing schema) instead of
    # running V1__baseline.sql; V2 onwards then run on it
    baseline-on-migrate: true
    baseline-version: 1

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}?sslmode=require
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      # one small instance: a few connections are plenty, and managed Postgres plans cap connections
      maximum-pool-size: ${DB_POOL_SIZE:8}
      minimum-idle: 2
      idle-timeout: 300000
      connection-timeout: 20000
      keepalive-time: 60000
      validation-timeout: 3000

  h2:
    console:
      enabled: false

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      # Flyway owns the schema; Hibernate only checks the entities match it
      ddl-auto: ${DDL_AUTO:validate}
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 25
        order_inserts: true
        order_updates: true

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false


app:
  # every store, Marea too, only on its own domains (tenant_domains): no store for unknown hosts
  tenancy:
    default-tenant-id: ${DEFAULT_TENANT_ID:0}
  rate-limit:
    # client IP header confirmed (see ClientIp); per-IP limits on unless RATE_LIMIT_PER_IP_ENABLED=false
    per-ip-enabled: ${RATE_LIMIT_PER_IP_ENABLED:true}

logging:
  level:
    com.ecommerce: INFO
    org.springframework.security: WARN
